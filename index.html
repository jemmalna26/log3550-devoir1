<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue de bibliothèque</title>
</head>
<body>
    
  <header>
    <h1>Catalogue de bibliothèque</h1>
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="#catalogue">Catalogue</a></li>
        <li><a href="#ajout">Ajouter un livre</a></li>
      </ul>
    </nav>
  </header>

   <main>

    <section id="catalogue" aria-labelledby="titre-catalogue">
      <h2 id="titre-catalogue">Catalogue</h2>
      <p id="compteur" aria-live="polite"></p>
      <div id="liste-livres"></div>
    </section>

        <section id="ajout" aria-labelledby="titre-ajout">
      <h2 id="titre-ajout">Ajouter un livre</h2>

      <form id="formulaire-ajout" novalidate>

        <div>
          <label for="titre">Titre</label>
          <input type="text" id="titre" name="titre" aria-describedby="erreur-titre">
          <p class="erreur" id="erreur-titre"></p>
        </div>

        <div>
          <label for="auteur">Auteur</label>
          <input type="text" id="auteur" name="auteur" aria-describedby="erreur-auteur">
          <p class="erreur" id="erreur-auteur"></p>
        </div>

      </form>
    </section>

  </main>

</body>
</html>
