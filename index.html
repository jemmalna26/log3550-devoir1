<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogue de bibliothèque</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Catalogue de bibliothèque</h1>
        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="#catalogue">Catalogue</a></li>
                <li><a href="#ajout">Ajouter un livre</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section id="catalogue" aria-labelledby="titre-catalogue">
            <h2 id="titre-catalogue">Catalogue</h2>

            <div class="outils">

                <div>
                    <label for="recherche">Rechercher (titre ou auteur)</label>
                    <input type="search" id="recherche">
                </div>

                <div>
                    <label for="filtre-categorie">Catégorie</label>
                    <select id="filtre-categorie">
                        <option value="">Toutes</option>
                        <option value="roman">Roman</option>
                        <option value="science">Science</option>
                        <option value="histoire">Histoire</option>
                        <option value="informatique">Informatique</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div>
                    <label for="tri">Trier par</label>
                    <select id="tri">
                        <option value="titre-asc">Titre (A → Z)</option>
                        <option value="titre-desc">Titre (Z → A)</option>
                        <option value="annee-asc">Année (croissant)</option>
                        <option value="annee-desc">Année (décroissant)</option>
                    </select>
                </div>

                <div>
                    <input type="checkbox" id="filtre-dispo">
                    <label for="filtre-dispo">Disponibles seulement</label>
                </div>

                <button type="button" id="btn-reinitialiser">Réinitialiser</button>

            </div>
            <p id="compteur" aria-live="polite"></p>
            <div id="liste-livres"></div>
        </section>

        <section id="ajout" aria-labelledby="titre-ajout">
            <h2 id="titre-ajout">Ajouter un livre</h2>

            <form id="formulaire-ajout" novalidate>

                <div>
                    <label for="titre">Titre</label>
                    <input type="text" id="titre" name="titre" aria-describedby="erreur-titre">
                    <p class="erreur" aria-live="polite" id="erreur-titre"></p>
                </div>

                <div>
                    <label for="auteur">Auteur</label>
                    <input type="text" id="auteur" name="auteur" aria-describedby="erreur-auteur">
                    <p class="erreur" aria-live="polite" id="erreur-auteur"></p>
                </div>

                <div>
                    <label for="annee">Année</label>
                    <input type="number" id="annee" name="annee" aria-describedby="erreur-annee">
                    <p class="erreur" aria-live="polite" id="erreur-annee"></p>
                </div>

                <div>
                    <label for="categorie">Catégorie</label>
                    <select id="categorie" name="categorie" aria-describedby="erreur-categorie">
                        <option value="">-- Choisir --</option>
                        <option value="roman">Roman</option>
                        <option value="science">Science</option>
                        <option value="histoire">Histoire</option>
                        <option value="informatique">Informatique</option>
                        <option value="autre">Autre</option>
                    </select>
                    <p class="erreur" aria-live="polite" id="erreur-categorie"></p>
                </div>

                <div>
                    <input type="checkbox" id="disponible" name="disponible" checked>
                    <label for="disponible">Disponible</label>
                </div>

                <button type="submit">Ajouter</button>

            </form>
        </section>

    </main>

    <footer>
        <p>LOG3550 Développement web · ISTEAH · Devoir 1</p>
    </footer>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
